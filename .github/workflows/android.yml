name: Android APK

# Builds the installable debug APK from the Vite static build via Capacitor.
# Runs on tags and manual dispatch (the dev sandbox has no JDK/Android SDK).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang + lld (WebAssembly toolchain)
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile C cores to WASM
        # Tolerate the pre-WASM-brick state where this script is absent.
        run: |
          if npm run | grep -q "build:wasm"; then
            npm run build:wasm
          else
            echo "build:wasm not defined yet — skipping until the WASM brick lands"
          fi

      - name: Vite production build (-> dist/)
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform and sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: golden-land-royale-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
