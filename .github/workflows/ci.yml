name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang + lld (WebAssembly toolchain)
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile C cores (noise + physics) to WASM
        # The WASM physics brick is not re-added yet; run the compile only
        # once package.json defines the script, instead of failing CI.
        run: |
          if npm run | grep -q "build:wasm"; then
            npm run build:wasm
          else
            echo "build:wasm not defined yet — skipping until the WASM brick lands"
          fi

      - name: Headless game-logic tests
        run: npm test

      - name: Type-check and Vite production build
        run: npm run build

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: math-core-wasm
          path: public/wasm/math_core.wasm

      - name: Upload static web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  browser-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GitHub-hosted runners can reach the Playwright browser CDN;
      # the restricted dev sandbox used for authoring cannot.
      - name: Install headless Chromium with OS libraries
        run: npx playwright install --with-deps chromium

      - name: Real-browser WebGL screenshots (orbit + first-person)
        run: npm run screenshot:browser

      - name: Upload browser screenshots and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: |
            screenshots/browser/
            playwright-report/
            test-results/
          if-no-files-found: warn

      # Artifact blobs are unreachable from some authoring sandboxes;
      # workflow annotations are returned by the GitHub API instead, so
      # emit the plain-text diagnostic as a single error annotation.
      - name: Annotate browser failure
        if: always()
        run: |
          DIAG=screenshots/browser/diag.txt
          if [ -f "$DIAG" ]; then
            MSG=$(tr '\n' '%0A' < "$DIAG")
            echo "::error title=Browser visual failure::$MSG"
          else
            echo "::warning title=Browser visual::no diagnostic file was produced"
          fi
