[package]
name = "ironveil-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "IRONVEIL deterministic terrain core (Rust -> WebAssembly, offline at runtime)"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
